name: VegFinder
options:
  bundleIdPrefix: com.vegfinder
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  VegFinder:
    type: application
    platform: iOS
    sources:
      - VegFinder
    # Xcode only honours INFOPLIST_KEY_* for keys it already knows, so custom keys
    # such as VegFinderCatalogURL are silently dropped from a generated plist.
    # This target therefore ships a real Info.plist.
    info:
      path: VegFinder/Info.plist
      properties:
        CFBundleDisplayName: VegFinder
        NSLocationWhenInUseUsageDescription: VegFinder uses your location to sort nearby restaurants by distance.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        # Development default. A release build must point this at the deployed
        # HTTPS /v1/catalog URL.
        VegFinderCatalogURL: http://localhost:8787/v1/catalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vegfinder.app
        DEVELOPMENT_TEAM: CNK57345QT
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    scheme:
      testTargets:
        - VegFinderTests
  VegFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VegFinderTests
    dependencies:
      - target: VegFinder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
