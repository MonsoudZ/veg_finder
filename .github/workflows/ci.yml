name: CI

on:
  push:
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vegfinder
          POSTGRES_PASSWORD: vegfinder
          POSTGRES_DB: vegfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vegfinder -d vegfinder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: service
    env:
      TEST_DATABASE_URL: postgresql://vegfinder:vegfinder@127.0.0.1:5432/vegfinder_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      # Runner images change their simulator line-up, so resolve a device at run
      # time rather than pinning a name that will eventually disappear.
      - name: Select an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          candidates = [
              (runtime, device)
              for runtime, devices in runtimes.items() if "iOS" in runtime
              for device in devices if device["name"].startswith("iPhone")
          ]
          if not candidates:
              sys.exit("no iPhone simulator is available on this runner")
          print(sorted(candidates, key=lambda pair: pair[0])[-1][1]["udid"])
          ')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Covers the dietary filter logic and the Info.plist wiring the app needs to
      # reach the catalog at all. Simulator builds do not need a signing identity.
      - name: Run tests
        run: |
          xcodebuild test \
            -project VegFinder.xcodeproj \
            -scheme VegFinder \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: TestResults.xcresult
