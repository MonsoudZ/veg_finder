name: CI

on:
  push:
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vegfinder
          POSTGRES_PASSWORD: vegfinder
          POSTGRES_DB: vegfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vegfinder -d vegfinder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: service
    env:
      TEST_DATABASE_URL: postgresql://vegfinder:vegfinder@127.0.0.1:5432/vegfinder_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
