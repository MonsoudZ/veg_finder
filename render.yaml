# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

databases:
  - name: vegfinder-postgres
    databaseName: vegfinder
    user: vegfinder
    region: ohio
    plan: 0.1c-256mb
    diskSizeGB: 15
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: vegfinder-api
    runtime: docker
    region: ohio
    plan: 0.5c-512mb
    dockerContext: ./service
    dockerfilePath: ./service/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    preDeployCommand: npm run migrate
    initialDeployHook: npm run seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vegfinder-postgres
          property: connectionString
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: MENU_CHECK_INTERVAL_HOURS
        value: "0"

  - type: cron
    name: vegfinder-menu-check
    runtime: docker
    region: ohio
    plan: 0.5c-512mb
    schedule: "0 12 * * *"
    dockerContext: ./service
    dockerfilePath: ./service/Dockerfile
    dockerCommand: npm run check
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vegfinder-postgres
          property: connectionString
